<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3D4757"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2E90D9"/>
    </marker>
  </defs>

  <rect width="1400" height="720" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="70" y="52" font-size="26" font-weight="bold" fill="#1A2233">Click → timeseries: on-demand data flow</text>

  <!-- ═══ Browser lane ═══ -->
  <rect x="60" y="90" width="1280" height="240" rx="12" fill="#F2F6FB" stroke="#D5DBE6"/>
  <text x="84" y="122" font-size="15" font-weight="bold" fill="#5B6579" letter-spacing="2">BROWSER — WEBGL VIEWER</text>

  <!-- Box 1: click -->
  <rect x="90" y="160" width="180" height="110" rx="10" fill="#FFFFFF" stroke="#B9C2D0" stroke-width="1.5"/>
  <text x="180" y="205" font-size="17" font-weight="bold" fill="#1A2233" text-anchor="middle">User clicks</text>
  <text x="180" y="228" font-size="14" fill="#5B6579" text-anchor="middle">on the surface</text>

  <!-- Box 2: facepick -->
  <rect x="330" y="160" width="230" height="110" rx="10" fill="#FFFFFF" stroke="#3FA45B" stroke-width="2"/>
  <text x="445" y="196" font-size="16" font-weight="bold" fill="#1A2233" text-anchor="middle">facepick</text>
  <text x="445" y="219" font-size="13.5" fill="#5B6579" text-anchor="middle">click → voxel (x, y, z),</text>
  <text x="445" y="238" font-size="13.5" fill="#5B6579" text-anchor="middle">vertex index, hemisphere</text>
  <rect x="395" y="248" width="100" height="20" rx="10" fill="#E4F3E9"/>
  <text x="445" y="262" font-size="11.5" font-weight="bold" fill="#2E7D44" text-anchor="middle">EXISTS TODAY</text>

  <!-- Box 5: plot panel -->
  <rect x="1030" y="145" width="280" height="140" rx="10" fill="#FFFFFF" stroke="#2E90D9" stroke-width="2.5"/>
  <text x="1170" y="176" font-size="16" font-weight="bold" fill="#1A2233" text-anchor="middle">TimeseriesAxes panel</text>
  <!-- mini timeseries sketch -->
  <polyline points="1055,232 1063,224 1071,238 1079,220 1087,230 1095,215 1103,236 1111,225 1119,241 1127,218 1135,228 1143,222 1151,234 1159,219 1167,229"
            fill="none" stroke="#2E90D9" stroke-width="2"/>
  <line x1="1111" y1="200" x2="1111" y2="248" stroke="#E8964A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- mini spectrum sketch -->
  <g fill="#7FB9E4">
    <rect x="1195" y="206" width="7" height="42"/><rect x="1205" y="216" width="7" height="32"/>
    <rect x="1215" y="228" width="7" height="20"/><rect x="1225" y="212" width="7" height="36"/>
    <rect x="1235" y="234" width="7" height="14"/><rect x="1245" y="238" width="7" height="10"/>
    <rect x="1255" y="240" width="7" height="8"/><rect x="1265" y="242" width="7" height="6"/>
  </g>
  <text x="1112" y="264" font-size="11.5" fill="#5B6579" text-anchor="middle">timeseries</text>
  <text x="1231" y="264" font-size="11.5" fill="#5B6579" text-anchor="middle">spectrum (Hz)</text>
  <rect x="1150" y="121" width="46" height="20" rx="10" fill="#E1EFFA"/>
  <text x="1173" y="135" font-size="11.5" font-weight="bold" fill="#1D6BA8" text-anchor="middle">NEW</text>

  <!-- ═══ Python lane ═══ -->
  <rect x="60" y="400" width="1280" height="240" rx="12" fill="#FBF7F0" stroke="#E2DACB"/>
  <text x="84" y="432" font-size="15" font-weight="bold" fill="#8A7B5E" letter-spacing="2">PYTHON — TORNADO SERVER · 4D DATA STAYS HERE</text>

  <!-- Box 3: handler -->
  <rect x="330" y="470" width="240" height="110" rx="10" fill="#FFFFFF" stroke="#2E90D9" stroke-width="2.5"/>
  <text x="450" y="506" font-size="15.5" font-weight="bold" fill="#1A2233" text-anchor="middle" font-family="Courier New, monospace">/timeseries</text>
  <text x="450" y="529" font-size="13.5" fill="#5B6579" text-anchor="middle">request handler</text>
  <rect x="427" y="541" width="46" height="20" rx="10" fill="#E1EFFA"/>
  <text x="450" y="555" font-size="11.5" font-weight="bold" fill="#1D6BA8" text-anchor="middle">NEW</text>

  <!-- Box 3b: numpy slice -->
  <rect x="630" y="470" width="240" height="110" rx="10" fill="#FFFFFF" stroke="#3FA45B" stroke-width="2"/>
  <text x="750" y="504" font-size="15.5" font-weight="bold" fill="#1A2233" text-anchor="middle">numpy slice</text>
  <text x="750" y="528" font-size="14" fill="#5B6579" text-anchor="middle" font-family="Courier New, monospace">data[:, z, y, x]</text>
  <text x="750" y="550" font-size="12.5" fill="#8A93A6" text-anchor="middle">microseconds — data already in memory</text>

  <!-- Box 4: scipy -->
  <rect x="930" y="470" width="220" height="110" rx="10" fill="#FFFFFF" stroke="#3FA45B" stroke-width="2"/>
  <text x="1040" y="504" font-size="15.5" font-weight="bold" fill="#1A2233" text-anchor="middle">scipy</text>
  <text x="1040" y="528" font-size="13.5" fill="#5B6579" text-anchor="middle">detrend + welch(TR)</text>
  <text x="1040" y="548" font-size="13.5" fill="#5B6579" text-anchor="middle">→ power spectrum</text>

  <!-- ═══ Arrows ═══ -->
  <!-- click → facepick -->
  <line x1="270" y1="215" x2="322" y2="215" stroke="#3D4757" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- facepick → handler (down) : the request -->
  <path d="M 445 270 L 445 330 L 448 330 L 448 462" fill="none" stroke="#2E90D9" stroke-width="2.5" marker-end="url(#arrowB)"/>
  <rect x="465" y="345" width="420" height="30" rx="6" fill="#EFF6FC" stroke="#BFDCF1"/>
  <text x="675" y="365" font-size="13.5" fill="#1D6BA8" text-anchor="middle" font-family="Courier New, monospace">GET /timeseries?voxel=x,y,z&amp;vertex=i&amp;hemi=lh</text>

  <!-- handler → numpy → scipy -->
  <line x1="570" y1="525" x2="622" y2="525" stroke="#3D4757" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="870" y1="525" x2="922" y2="525" stroke="#3D4757" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- scipy → panel (up) : the response -->
  <path d="M 1150 505 L 1250 505 L 1250 293" fill="none" stroke="#2E90D9" stroke-width="2.5" marker-end="url(#arrowB)"/>
  <rect x="1005" y="308" width="230" height="46" rx="6" fill="#EFF6FC" stroke="#BFDCF1"/>
  <text x="1120" y="327" font-size="13.5" font-weight="bold" fill="#1D6BA8" text-anchor="middle">≈ 2 KB JSON</text>
  <text x="1120" y="345" font-size="12.5" fill="#1D6BA8" text-anchor="middle" font-family="Courier New, monospace">{time, bold, freqs, power}</text>

  <!-- page-load note (left, between lanes) -->
  <text x="90" y="352" font-size="13" fill="#8A93A6">Page load (once): browser receives one light</text>
  <text x="90" y="371" font-size="13" fill="#8A93A6">volume (mean / tSNR, ≈ 3 MB) — never the 4D data.</text>

  <!-- ═══ Footer punchline ═══ -->
  <rect x="60" y="666" width="1280" height="2" fill="#E4E8EF"/>
  <text x="700" y="700" font-size="17" font-weight="bold" fill="#1A2233" text-anchor="middle">Cost per click ≈ 2 KB — independent of run length.  The 4D data never leaves Python.</text>
</svg>
